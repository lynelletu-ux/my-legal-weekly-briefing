<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="每周歌曲推荐榜历史归档">
  <title>🎵每周歌曲推荐榜｜历史归档</title>
  <style>
    :root{--bg:#0b0a0f;--panel:#17151c;--text:#f7f5f8;--muted:#aaa4b2;--line:rgba(255,255,255,.10);--pink:#ff4f68;--purple:#8b5cf6}
    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(circle at 20% -10%,rgba(139,92,246,.14),transparent 30%),linear-gradient(180deg,#120e15,#0b0a0f 42%,#09080c);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;line-height:1.75}
    header,main{width:min(920px,calc(100% - 28px));margin:0 auto}
    header{padding:58px 0 30px}
    .kicker{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#c3bccb;font-weight:800}
    h1{margin:8px 0 10px;font-size:clamp(30px,6vw,46px);letter-spacing:-.03em}
    header p{margin:0;color:#d3cdd7}
    section{margin:18px 0 60px;padding:26px;border:1px solid var(--line);border-radius:24px;background:var(--panel);box-shadow:0 20px 60px rgba(0,0,0,.28)}
    h2{margin:0 0 14px;font-size:20px}
    .issues{list-style:none;margin:0;padding:0}
    .issues li{padding:17px 0;border-bottom:1px solid rgba(255,255,255,.07)}
    .issues li:last-child{border-bottom:0}
    .issues a{color:#fff;text-decoration:none;font-weight:750}
    .issues a:hover{color:#ff7184}
    .meta{margin-top:4px;color:var(--muted);font-size:14px}
    footer{padding:0 0 48px;text-align:center;color:#77707f;font-size:12px}
    @media(max-width:720px){header,main{width:calc(100% - 20px)}header{padding-top:34px}section{padding:20px 18px;border-radius:20px}}
  </style>
</head>
<body>
<header>
  <div class="kicker">WEEKLY MUSIC PICKS · PERSONAL EDITION</div>
  <h1>🎵每周歌曲推荐榜</h1>
  <p>历史归档 · Durable Publish Layer</p>
</header>
<main>
  <section aria-labelledby="issues-heading">
    <h2 id="issues-heading">正式周榜</h2>
    <ul class="issues">
      <li><div class="meta">新的正式周榜将在这里按时间倒序归档。</div></li>
    </ul>
  </section>
</main>
<footer>Curated for your weekly listening · Apple Music CN verified</footer>
</body>
</html>
